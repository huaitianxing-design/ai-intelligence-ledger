name: Diagnose package download

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag.yml'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe download channels
        run: |
          set +e
          {
            echo "## runner"; date -u; uname -a
            echo
            echo "## dns aka.doubaocdn.com"; getent hosts aka.doubaocdn.com || echo "DNS-FAIL"
            echo "## dns p6-flow-sign.byteimg.com"; getent hosts p6-flow-sign.byteimg.com || echo "DNS-FAIL"
            echo
            echo "## curl -v L short-url"; curl -v -L --max-time 60 -o /tmp/a.zip -w "RESULT http=%{http_code} size=%{size_download} url=%{url_effective}\n" "https://aka.doubaocdn.com/s/XLzcsDDYs9"; echo "EXIT=$?"
            echo
            echo "## curl L short-url with browser UA"; curl -sS -L --max-time 60 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o /tmp/b.zip -w "RESULT http=%{http_code} size=%{size_download}\n" "https://aka.doubaocdn.com/s/XLzcsDDYs9"; echo "EXIT=$?"
            echo
            echo "## curl HEAD short-url"; curl -sS -I --max-time 30 "https://aka.doubaocdn.com/s/XLzcsDDYs9"; echo "EXIT=$?"
            echo
            echo "## curl byteimg host reachability"; curl -sS -o /dev/null -w "http=%{http_code}\n" --max-time 30 "https://p6-flow-sign.byteimg.com/"; echo "EXIT=$?"
            echo
            echo "## ls downloaded"; ls -la /tmp/a.zip /tmp/b.zip 2>&1
            echo "## sha256 of downloaded if any"; sha256sum /tmp/a.zip /tmp/b.zip 2>&1
          } > diag.txt 2>&1
          cat diag.txt

      - name: Commit diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "diag: package download probe"
          git push origin HEAD:main
