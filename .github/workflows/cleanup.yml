name: Cleanup import artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove temporary import files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch diag.txt .github/workflows/diag.yml .github/workflows/cleanup.yml
          if git diff --cached --quiet; then echo "nothing to remove"; exit 0; fi
          git commit -m "chore: remove import and diagnostic artifacts"
          git push origin HEAD:main
